name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o EncryptedNotebook-project.zip
          echo "Project extracted"
          find EncryptedNotebook -maxdepth 2 -type f | sort

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6'

      - name: Build debug APK
        working-directory: EncryptedNotebook
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-notebook-debug-apk
          path: EncryptedNotebook/app/build/outputs/apk/debug/app-debug.apk
