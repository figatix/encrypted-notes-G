
name: Build Encrypted Notebook APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="EncryptedNotebook-project-v3.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Project ZIP not found in repository root"
            ls -la
            exit 1
          fi

          unzip -oq "$ARCHIVE" -d extracted

          PROJECT_DIR="extracted/EncryptedNotebook"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::Gradle settings file not found"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Run unit tests and build debug APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" \
            testDebugUnitTest assembleDebug \
            --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-notebook-debug-apk
          path: extracted/EncryptedNotebook/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
