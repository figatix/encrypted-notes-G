
name: Build Encrypted Notebook APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract project archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=""
          for candidate in \
            "EncryptedNotebook-project-v3.zip" \
            "EncryptedNotebook/EncryptedNotebook-project-v3.zip"
          do
            if [ -f "$candidate" ]; then
              ARCHIVE="$candidate"
              break
            fi
          done

          if [ -z "$ARCHIVE" ]; then
            ARCHIVE="$(find . -maxdepth 3 -type f -name '*.zip' -print -quit)"
          fi

          if [ -z "$ARCHIVE" ]; then
            echo "::error::Project ZIP archive was not found."
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/encrypted-notebook"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/encrypted-notebook"

          GRADLEW="$(find "$RUNNER_TEMP/encrypted-notebook" -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew was not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

      - name: Run unit tests and build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-notebook-debug-apk
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
